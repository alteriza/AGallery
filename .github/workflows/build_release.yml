name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release (0.1-beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 1. Generate launcher icons dari icon.png di root repo
      # ------------------------------------------------------------
      - name: Generate launcher icons
        timeout-minutes: 3
        run: |
          set -e
          ls -lh icon.png
          file icon.png

          python3 -m pip install --quiet --disable-pip-version-check Pillow

          python3 <<'PY'
          from PIL import Image
          import os

          SRC = "icon.png"
          RES = "app/src/main/res"

          # density: (legacy_px, foreground_px, canvas_px)
          SIZES = {
              "mdpi":    (48,  72,  108),
              "hdpi":    (72,  108, 162),
              "xhdpi":   (96,  144, 216),
              "xxhdpi":  (144, 216, 324),
              "xxxhdpi": (192, 288, 432),
          }

          img = Image.open(SRC).convert("RGBA")
          print(f"Source: {img.size[0]}x{img.size[1]}")

          for dpi, (legacy, fg_size, fg_canvas) in SIZES.items():
              d = f"{RES}/mipmap-{dpi}"
              os.makedirs(d, exist_ok=True)

              # Legacy (square) — dipakai juga untuk round
              img.resize((legacy, legacy), Image.LANCZOS).save(f"{d}/ic_launcher.png")
              img.resize((legacy, legacy), Image.LANCZOS).save(f"{d}/ic_launcher_round.png")

              # Adaptive foreground: 66% di tengah canvas
              fg = img.resize((fg_size, fg_size), Image.LANCZOS)
              canvas = Image.new("RGBA", (fg_canvas, fg_canvas), (0, 0, 0, 0))
              off = (fg_canvas - fg_size) // 2
              canvas.paste(fg, (off, off), fg)
              canvas.save(f"{d}/ic_launcher_foreground.png")

          # Adaptive XML
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''.lstrip()

          os.makedirs(f"{RES}/mipmap-anydpi-v26", exist_ok=True)
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"{RES}/mipmap-anydpi-v26/{name}", "w") as f:
                  f.write(xml)

          # Background color
          os.makedirs(f"{RES}/values", exist_ok=True)
          with open(f"{RES}/values/ic_launcher_background.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#7C5CFF</color>
          </resources>
          '''.lstrip())

          print("✅ Icons generated")
          PY
      # ------------------------------------------------------------
      # 2. Setup signing: pakai secret kalau ada, generate kalau belum
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        id: signing
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ] \
             && [ -n "${SECRET_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${SECRET_KEY_ALIAS:-}" ] \
             && [ -n "${SECRET_KEY_PASSWORD:-}" ]; then
            echo "✅ Menggunakan keystore dari GitHub Secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Secret keystore belum lengkap — generate keystore baru (run pertama)."
            STORE_PASS="AGallery_$(openssl rand -hex 12)"
            KEY_PASS="$STORE_PASS"
            ALIAS="agallery"

            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AGallery, OU=Dev, O=AGallery, L=Jakarta, S=DKI, C=ID" >/dev/null 2>&1

            base64 -w0 release.keystore > keystore-base64.txt

            {
              echo "# AGallery — Signing Credentials (run pertama)"
              echo ""
              echo "Simpan nilai berikut di **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "## KEYSTORE_BASE64"
              echo '```'
              cat keystore-base64.txt
              echo '```'
              echo ""
              echo "## KEYSTORE_PASSWORD"
              echo '```'
              echo "$STORE_PASS"
              echo '```'
              echo ""
              echo "## KEY_ALIAS"
              echo '```'
              echo "$ALIAS"
              echo '```'
              echo ""
              echo "## KEY_PASSWORD"
              echo '```'
              echo "$KEY_PASS"
              echo '```'
            } > keystore-credentials.md

            echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Signing summary
        if: steps.signing.outputs.generated == 'true'
        run: |
          {
            echo "## 🔐 Keystore baru dibuat"
            echo ""
            echo "Download **keystore-credentials.md** dari halaman Release, lalu simpan nilainya sebagai GitHub Secrets:"
            echo ""
            echo "- \`KEYSTORE_BASE64\`"
            echo "- \`KEYSTORE_PASSWORD\`"
            echo "- \`KEY_ALIAS\`"
            echo "- \`KEY_PASSWORD\`"
            echo ""
            echo "Setelah secret disimpan, run berikutnya otomatis pakai keystore yang sama."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 3. Build release (langsung signed, tanpa artifact)
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ------------------------------------------------------------
      # Setup Android SDK (tanpa auto-license)
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # ------------------------------------------------------------
      # Terima lisensi secara non-interaktif
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          set -e
          # Pastikan sdkmanager ada di PATH (biasanya sudah dari setup-android)
          which sdkmanager
          # Pipe 'yes' agar semua prompt (y/N) otomatis terjawab 'y'
          # Gunakan || true agar tidak gagal kalau semua lisensi sudah accepted
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Android SDK licenses accepted."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      # ------------------------------------------------------------
      # 4. Upload langsung ke GitHub Release (tanpa actions/upload-artifact)
      # ------------------------------------------------------------
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AGallery ${{ github.ref_name }} (0.1-beta)
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated keystore to Release (first run only)
        if: steps.signing.outputs.generated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            keystore-base64.txt
            keystore-credentials.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
