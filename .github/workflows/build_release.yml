name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release (0.1-beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 1. Generate launcher icons dari icon.png di root repo
      # ------------------------------------------------------------
      - name: Generate launcher icons
        run: |
          set -e
          ICON="icon.png"
          if [ ! -f "$ICON" ]; then
            echo "❌ icon.png tidak ditemukan di root repo. Tambahkan file icon.png (1024x1024 PNG)."
            exit 1
          fi

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

          RES="app/src/main/res"
          mkdir -p "$RES"/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}
          mkdir -p "$RES"/mipmap-anydpi-v26
          mkdir -p "$RES"/values

          # --- Legacy launcher icons (48–192 px) ---
          convert "$ICON" -resize 48x48   "$RES/mipmap-mdpi/ic_launcher.png"
          convert "$ICON" -resize 72x72   "$RES/mipmap-hdpi/ic_launcher.png"
          convert "$ICON" -resize 96x96   "$RES/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON" -resize 144x144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON" -resize 192x192 "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # --- Round icons ---
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

          # --- Adaptive foreground: konten di 66% safe zone ---
          convert "$ICON" -resize 72x72   -gravity center -background none -extent 108x108 "$RES/mipmap-mdpi/ic_launcher_foreground.png"
          convert "$ICON" -resize 108x108 -gravity center -background none -extent 162x162 "$RES/mipmap-hdpi/ic_launcher_foreground.png"
          convert "$ICON" -resize 144x144 -gravity center -background none -extent 216x216 "$RES/mipmap-xhdpi/ic_launcher_foreground.png"
          convert "$ICON" -resize 216x216 -gravity center -background none -extent 324x324 "$RES/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert "$ICON" -resize 288x288 -gravity center -background none -extent 432x432 "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"

          # --- Adaptive icon XML ---
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
             "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # --- Warna background adaptive icon ---
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#7C5CFF</color>
          </resources>
          XML

          echo "✅ Launcher icons berhasil di-generate dari $ICON"

      # ------------------------------------------------------------
      # 2. Setup signing: pakai secret kalau ada, generate kalau belum
      # ------------------------------------------------------------
      - name: Prepare signing keystore
        id: signing
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "${SECRET_KEYSTORE_BASE64:-}" ] \
             && [ -n "${SECRET_KEYSTORE_PASSWORD:-}" ] \
             && [ -n "${SECRET_KEY_ALIAS:-}" ] \
             && [ -n "${SECRET_KEY_PASSWORD:-}" ]; then
            echo "✅ Menggunakan keystore dari GitHub Secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Secret keystore belum lengkap — generate keystore baru (run pertama)."
            STORE_PASS="AGallery_$(openssl rand -hex 12)"
            KEY_PASS="$STORE_PASS"
            ALIAS="agallery"

            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=AGallery, OU=Dev, O=AGallery, L=Jakarta, S=DKI, C=ID" >/dev/null 2>&1

            base64 -w0 release.keystore > keystore-base64.txt

            {
              echo "# AGallery — Signing Credentials (run pertama)"
              echo ""
              echo "Simpan nilai berikut di **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "## KEYSTORE_BASE64"
              echo '```'
              cat keystore-base64.txt
              echo '```'
              echo ""
              echo "## KEYSTORE_PASSWORD"
              echo '```'
              echo "$STORE_PASS"
              echo '```'
              echo ""
              echo "## KEY_ALIAS"
              echo '```'
              echo "$ALIAS"
              echo '```'
              echo ""
              echo "## KEY_PASSWORD"
              echo '```'
              echo "$KEY_PASS"
              echo '```'
            } > keystore-credentials.md

            echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"

      - name: Signing summary
        if: steps.signing.outputs.generated == 'true'
        run: |
          {
            echo "## 🔐 Keystore baru dibuat"
            echo ""
            echo "Download **keystore-credentials.md** dari halaman Release, lalu simpan nilainya sebagai GitHub Secrets:"
            echo ""
            echo "- \`KEYSTORE_BASE64\`"
            echo "- \`KEYSTORE_PASSWORD\`"
            echo "- \`KEY_ALIAS\`"
            echo "- \`KEY_PASSWORD\`"
            echo ""
            echo "Setelah secret disimpan, run berikutnya otomatis pakai keystore yang sama."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 3. Build release (langsung signed, tanpa artifact)
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ------------------------------------------------------------
      # Setup Android SDK (tanpa auto-license)
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false   # kita handle manual di step bawah
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'           # buang 'tools' yang sudah obsolete

      # ------------------------------------------------------------
      # Terima lisensi secara non-interaktif
      # ------------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          set -e
          # Pastikan sdkmanager ada di PATH (biasanya sudah dari setup-android)
          which sdkmanager
          # Pipe 'yes' agar semua prompt (y/N) otomatis terjawab 'y'
          # Gunakan || true agar tidak gagal kalau semua lisensi sudah accepted
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "✅ Android SDK licenses accepted."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      # ------------------------------------------------------------
      # 4. Upload langsung ke GitHub Release (tanpa actions/upload-artifact)
      # ------------------------------------------------------------
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AGallery ${{ github.ref_name }} (0.1-beta)
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated keystore to Release (first run only)
        if: steps.signing.outputs.generated == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            keystore-base64.txt
            keystore-credentials.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
